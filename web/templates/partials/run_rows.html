{# One row per run. Shared so the dashboard's five and the full history cannot drift apart. #}
<table class="rows">
  <tbody>
  {% for e in rows %}
    <tr>
      <td>{{ e.date }}</td>
      <td style="color:var(--dim);">{{ e.slot }}</td>
      <td class="topic">{{ e.topic }}</td>
      <td>
        <span class="chip {% if e.status == 'posted' %}chip-teal{% elif e.status == 'failed' %}chip-rose{% endif %}">
          {{ e.status }}
        </span>
      </td>
      <td>
        {% set url = link_for(e) %}
        {% if url %}<a class="link" href="{{ url }}" target="_blank" rel="noopener">View ↗</a>
        {% else %}<span style="color:var(--dim); font-size:12px;">{{ e.error[:40] }}</span>{% endif %}
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
